services:
  - type: web
    name: yaqin-xizmatlar
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      # Render o'zi tasodifiy token yaratadi (Dashboard → Environment da ko'rasiz).
      - key: ADMIN_TOKEN
        generateValue: true
