<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yaqin xizmatlar</title>
<meta name="description" content="Toshkent bo'yicha yaqin dorixona, shifoxona, bank, kafe, yoqilg'i va metro joylarini toping.">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><div class="mk">📍</div><span class="t">Yaqin xizmatlar</span></div>
  <div class="search"><span aria-hidden="true">🔎</span><input id="q" type="search" placeholder="Nom yoki manzil bo'yicha qidiring…" aria-label="Qidiruv"></div>
  <button class="iconbtn" id="geo" title="Mening joylashuvim" aria-label="Mening joylashuvim">🎯</button>
  <button class="iconbtn" id="theme" title="Mavzuni almashtirish" aria-label="Mavzuni almashtirish">🌓</button>
</header>

<main>
  <section class="panel" aria-label="Natijalar">
    <div class="filters">
      <div class="chips" id="chips"></div>
      <div class="row">
        <label><input type="checkbox" id="openOnly"> Hozir ochiq</label>
        <label>Saralash:
          <select id="sort">
            <option value="dist">Masofa</option>
            <option value="rating">Reyting</option>
            <option value="name">Nomi</option>
          </select>
        </label>
      </div>
    </div>
    <div class="count" id="count" aria-live="polite"></div>
    <ul class="list" id="list"></ul>
  </section>

  <section class="mapwrap" aria-label="Xarita">
    <svg id="map" viewBox="0 0 1000 760" role="img" aria-label="Toshkent sxematik xaritasi"></svg>
    <div class="zoom">
      <button id="zin" aria-label="Yaqinlashtirish">＋</button>
      <button id="zout" aria-label="Uzoqlashtirish">－</button>
      <button id="zreset" aria-label="Asl holat">⟲</button>
    </div>
    <div class="hint">Xaritada bo'sh joyni bossangiz — «Men» nuqtasi ko'chadi</div>
    <article class="detail" id="detail" hidden></article>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
